<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsletter | Neesh</title>
<meta name="description" content="Stay up to date on all things NEESH.">
<meta property="og:title" content="Neesh Newsletter">
<meta property="og:description" content="Stay up to date on all things NEESH.">
<meta property="og:url" content="https://neesh.art/newsletter">
<link rel="canonical" href="https://neesh.art/newsletter">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#111114;--body:#5b5b66;--border:#E6E6EB;--white:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Manrope',sans-serif;background:var(--white);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:440px;text-align:center}
.brand img{height:22px;width:auto;display:inline-block;margin-bottom:36px}
h1{font-weight:800;font-size:clamp(24px,5vw,32px);letter-spacing:-0.02em;line-height:1.15;margin-bottom:28px}
form{display:flex;flex-direction:column;gap:12px}
input[type=email]{font-family:inherit;font-size:15px;padding:13px 16px;border:1px solid var(--border);border-radius:8px;outline:none;width:100%}
input[type=email]:focus{border-color:#c9c9d2}
button{font-family:inherit;background:var(--ink);color:#fff;font-weight:600;font-size:15px;padding:13px 22px;border-radius:8px;border:none;cursor:pointer;transition:opacity .15s}
button:hover{opacity:.85}
button:disabled{opacity:.6;cursor:default}
.msg{margin-top:16px;font-size:14px;color:var(--body);min-height:20px}
.msg.error{color:#b3261e}
.success{display:none}
.success h1{margin-bottom:12px}
.success p{color:var(--body);font-size:15px}
.done .success{display:block}
.done form,.done .msg,.done>h1{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="card" id="card">
  <a class="brand" href="https://neesh.art"><img src="/newsletter/assets/neesh_wordmark.png" alt="Neesh"></a>
  <h1>Stay up to date on all things NEESH</h1>
  <form id="form" novalidate>
    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required aria-label="Email address">
    <button type="submit" id="submit">Subscribe</button>
  </form>
  <p class="msg" id="msg" role="status"></p>
  <div class="success">
    <h1>You&rsquo;re on the list.</h1>
    <p>Thanks for subscribing &mdash; we&rsquo;ll be in touch.</p>
  </div>
</div>
<script>
(function(){
  // Same list the main-site capture writes to: public.mailing_list_subscribers
  var SUPABASE_URL = 'https://smfzrubkyxejzkblrrjr.supabase.co';
  var SUPABASE_KEY = 'sb_publishable__1gThSP9l8qN1Elj4jCfLg_SN8S62lO';
  var form = document.getElementById('form');
  var msg = document.getElementById('msg');
  var btn = document.getElementById('submit');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      msg.textContent = 'Please enter a valid email address.';
      msg.classList.add('error');
      return;
    }
    msg.textContent = '';
    msg.classList.remove('error');
    btn.disabled = true;
    fetch(SUPABASE_URL + '/rest/v1/mailing_list_subscribers', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ email: email })
    }).then(function(res){
      // 409 = unique-email conflict: already subscribed, treat as success
      if(res.ok || res.status === 409){
        document.getElementById('card').classList.add('done');
      } else {
        throw new Error('status ' + res.status);
      }
    }).catch(function(){
      btn.disabled = false;
      msg.textContent = 'Something went wrong. Please try again.';
      msg.classList.add('error');
    });
  });
})();
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
